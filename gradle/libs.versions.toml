[versions]
kotlin              = "2.0.21"
ksp                 = "2.0.21-1.0.27"
jetbrainsCompose    = "1.7.3"
lifecycleDesktop    = "2.8.4"
navigationDesktop   = "2.8.0-alpha10"
room                = "2.7.0-alpha11"
sqlite              = "2.5.0-alpha11"
serialization       = "1.7.3"
coroutines          = "1.9.0"
javaxInject         = "1"

# Testing
junit               = "4.13.2"

[libraries]
# Lifecycle & Navigation (JetBrains Multiplatform / Desktop)
jetbrains-lifecycle-viewmodel-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleDesktop" }
jetbrains-lifecycle-runtime-compose   = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose",   version.ref = "lifecycleDesktop" }
jetbrains-navigation-compose          = { group = "org.jetbrains.androidx.navigation", name = "navigation-compose",         version.ref = "navigationDesktop" }

# Room JVM + Bundled SQLite Driver
androidx-room-runtime               = { group = "androidx.room",   name = "room-runtime",   version.ref = "room" }
androidx-room-compiler              = { group = "androidx.room",   name = "room-compiler",  version.ref = "room" }
androidx-sqlite-bundled             = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }

# Coroutines + Serialization + Inject
kotlinx-coroutines-core             = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core",  version.ref = "coroutines" }
kotlinx-coroutines-swing            = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-serialization-json          = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
javax-inject                        = { group = "javax.inject",          name = "javax.inject",               version.ref = "javaxInject" }
kotlin-reflect                      = { group = "org.jetbrains.kotlin",  name = "kotlin-reflect",             version.ref = "kotlin" }

# Testing
junit                               = { group = "junit",                name = "junit",             version.ref = "junit" }
kotlin-test-junit                   = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }

[plugins]
kotlin-jvm           = { id = "org.jetbrains.kotlin.jvm",                  version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
jetbrains-compose    = { id = "org.jetbrains.compose",                     version.ref = "jetbrainsCompose" }
ksp                  = { id = "com.google.devtools.ksp",                   version.ref = "ksp" }

